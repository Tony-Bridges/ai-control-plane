environment: production
debug: false
workers: 4
log_level: INFO

allowed_origins:
  - "https://app.example.com"
allowed_hosts:
  - "api.example.com"

redis:
  host: redis-service
  port: 6379

opa:
  url: http://opa-service:8181

postgres:
  host: postgres-service
  port: 5432
  database: aiaudit
  user: audit_user
  password: ${POSTGRES_PASSWORD}

models:
  default_timeout: 30
  fallback_model: local_llama

security:
  rate_limit_per_minute: 100
  fail_closed: true
