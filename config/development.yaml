environment: development
debug: true
workers: 1
log_level: DEBUG

allowed_origins:
  - "http://localhost:3000"
  - "http://localhost:8080"
allowed_hosts:
  - "localhost"
  - "127.0.0.1"

redis:
  host: localhost
  port: 6379

opa:
  url: http://localhost:8181

postgres:
  host: localhost
  port: 5432
  database: aiaudit_dev
  user: audit_user
  password: audit_pass

models:
  default_timeout: 30
  fallback_model: local_llama
