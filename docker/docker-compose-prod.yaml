version: '3.8'

services:
  # ... (previous services) ...
  
  # Hashicorp Vault for Secrets
  vault:
    image: vault:latest
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
    ports:
      - "8200:8200"
    networks:
      - ai_network
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Control Plane with Vault integration
  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - OPA_URL=http://opa:8181
      - POSTGRES_HOST=postgres
      - SECRETS_PROVIDER=hashicorp_vault
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - ENVIRONMENT=production
    depends_on:
      - vault
      - redis
      - postgres
      - opa
    volumes:
      - ../logs:/app/logs
    networks:
      - ai_network
    restart: unless-stopped

volumes:
  vault_data: