apiVersion: v1
kind: Service
metadata:
  name: envoy-service
  namespace: ai-gateway
  labels:
    app: envoy
spec:
  type: LoadBalancer
  selector:
    app: envoy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: admin
    port: 9901
    targetPort: 9901
    protocol: TCP
